<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо за ответ — Даниил & Карина</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #FAF7F2;
            color: #2C2C2C;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .card {
            max-width: 680px;
            width: 100%;
            padding: 56px 32px;
            border: 1px solid rgba(184, 149, 106, 0.3);
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 60px rgba(44, 44, 44, 0.08);
        }

        .monogram {
            font-family: 'Great Vibes', cursive;
            font-size: 72px;
            color: #B8956A;
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-style: italic;
            font-weight: 400;
            margin-bottom: 20px;
        }

        p {
            color: #4A4A4A;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .date {
            font-family: 'Playfair Display', serif;
            color: #B8956A;
            font-size: 26px;
            margin-bottom: 36px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #B8956A;
            color: #FAF7F2;
            padding: 15px 32px;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            font-size: 12px;
            transition: 0.3s ease;
        }

        a:hover {
            background: #8C6B4A;
            transform: translateY(-2px);
        }

        .line {
            width: 80px;
            height: 1px;
            background: #B8956A;
            margin: 0 auto 28px;
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="monogram">Д & К</div>

        <div class="line"></div>

        <h1>Спасибо за ваш ответ!</h1>

        <p>
            Мы получили ваше подтверждение и очень рады, что вы разделите с нами этот особенный день.
        </p>

        <div class="date">3 августа 2026</div>

        <a href="./index.html">Вернуться на сайт</a>
    </main>

</body>
</html>
